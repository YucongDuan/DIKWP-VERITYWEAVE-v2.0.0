[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dikwp-verityweave"
version = "2.0.0"
description = "Evidence-aware semantic resilience, contextual repair, circulation governance, and agent-lineage auditing."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Yucong Duan / DIKWP open research programme"}]
keywords = ["DIKWP", "information-integrity", "content-governance", "misinformation", "provenance", "MCP", "AT-Protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
verityweave = "dikwp_verityweave.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dikwp_verityweave.data" = ["*.html", "*.json", "*.md"]
